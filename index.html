<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Slip</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { background: #00b900; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; }
        .btn:disabled { background: #ccc; }
        input[type=file] { margin: 20px 0; width: 100%; }
        #status { margin-top: 20px; font-weight: bold; }
        #userProfile { margin-bottom: 10px; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h2>แนบหลักฐานการโอนเงิน</h2>
        <div id="userProfile">กำลังโหลดข้อมูลโปรไฟล์...</div>
        
        <input type="file" id="fileInput" accept="image/*">
        <button id="submitBtn" class="btn" onclick="uploadSlip()">ส่งสลิป</button>
        <p id="status"></p>
    </div>

    <script>
        const MY_LIFF_ID = '2008841862-yyOOifz4'; 
        const N8N_WEBHOOK_URL = 'https://n8n.chaiwan-acct.com/webhook/payment_slip-sso';

        async function main() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const context = liff.getContext();
                    const profile = await liff.getProfile();
                    
                    // ตรวจสอบว่าเปิดในกลุ่มหรือไม่
                    if (context && (context.groupId || context.roomId)) {
                        const targetId = context.groupId || context.roomId;
                        
                        // --- ส่วนสำคัญ ---
                        // คุณอาจจะต้องสร้าง endpoint ใน n8n เพื่อรับ groupId แล้วส่งชื่อกลุ่มกลับมา
                        // ตัวอย่างสมมติว่าคุณส่ง groupId ไปถาม n8n:
                        try {
                            const response = await fetch(`https://n8n.chaiwan-acct.com/webhook/get-group-name?groupId=${targetId}`);
                            const data = await response.json();
                            document.getElementById('userProfile').innerText = "กลุ่ม: " + (data.groupName || "ไม่ทราบชื่อกลุ่ม");
                        } catch (e) {
                            document.getElementById('userProfile').innerText = "สวัสดีคุณ: " + profile.displayName;
                        }
                    } else {
                        // ถ้าเปิดคุยส่วนตัว ให้แสดงชื่อคนเหมือนเดิม
                        document.getElementById('userProfile').innerText = "สวัสดีคุณ: " + profile.displayName;
                    }
                }
            } catch (err) {
                console.error('LIFF Error:', err);
            }
        }

        async function uploadSlip() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const submitBtn = document.getElementById('submitBtn');
            
            if (fileInput.files.length === 0) {
                alert('กรุณาเลือกรูปภาพสลิป');
                return;
            }

            // เริ่มส่งข้อมูล
            submitBtn.disabled = true;
            status.style.color = "blue";
            status.innerText = "กำลังอัปโหลดและบันทึกข้อมูล...";

            try {
                const file = fileInput.files[0];
                const profile = await liff.getProfile();
                const context = liff.getContext(); // ดึงข้อมูลบริบทที่เปิด LIFF

                const formData = new FormData();
                formData.append('file', file);
                formData.append('userId', profile.userId);
                formData.append('displayName', profile.displayName);
                
                // ดึงค่า Group ID หรือ Room ID (ถ้ามี)
                // ถ้าเปิดในกลุ่มค่า groupId จะมีค่า ถ้าเปิดคุยส่วนตัวค่านี้จะเป็น null
                const groupId = context.groupId || context.roomId || profile.userId;
                formData.append('groupId', groupId);

                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    status.style.color = "green";
                    status.innerText = "ส่งสำเร็จ! กำลังปิดหน้าต่าง...";
                    setTimeout(() => {
                        liff.closeWindow(); 
                    }, 2000);
                } else {
                    throw new Error('Server responded with ' + response.status);
                }
            } catch (err) {
                status.style.color = "red";
                status.innerText = "เกิดข้อผิดพลาด: " + err.message;
                submitBtn.disabled = false;
                console.error(err);
            }
        }

        main();
    </script>
</body>
</html>
