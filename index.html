<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Slip</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .btn { background: #00b900; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        input[type=file] { margin: 20px 0; width: 100%; }
        #status { margin-top: 20px; font-weight: bold; }
        #userProfile { margin-bottom: 10px; color: #555; font-size: 1.1em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>แนบหลักฐานการโอนเงิน</h2>
        <div id="userProfile">กำลังโหลดข้อมูลผู้ใช้...</div>
        
        <input type="file" id="fileInput" accept="image/*">
        <button id="submitBtn" class="btn" onclick="uploadSlip()">ส่งสลิป</button>
        <p id="status"></p>
    </div>

    <script>
        const MY_LIFF_ID = '2008841862-yyOOifz4'; 
        const N8N_WEBHOOK_URL = 'https://n8n.chaiwan-acct.com/webhook/payment_slip-sso';

        async function main() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                // ดึงข้อมูลโปรไฟล์มาแสดงชื่อผู้ใช้เสมอ
                const profile = await liff.getProfile();
                document.getElementById('userProfile').innerText = "สวัสดีคุณ: " + profile.displayName;

            } catch (err) {
                console.error('LIFF Error:', err);
                document.getElementById('userProfile').innerText = "ไม่สามารถโหลดข้อมูลโปรไฟล์ได้";
            }
        }

        async function uploadSlip() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const submitBtn = document.getElementById('submitBtn');
            
            if (fileInput.files.length === 0) {
                alert('กรุณาเลือกรูปภาพสลิป');
                return;
            }

            submitBtn.disabled = true;
            status.style.color = "blue";
            status.innerText = "กำลังอัปโหลด...";

            try {
                const file = fileInput.files[0];
                const profile = await liff.getProfile();
                const context = liff.getContext();

                const formData = new FormData();
                formData.append('file', file);
                formData.append('userId', profile.userId);
                formData.append('displayName', profile.displayName);
                
                // เก็บ context ข้อมูลแชท (ถ้ามี)
                const targetId = context.groupId || context.roomId || profile.userId;
                formData.append('groupId', targetId);

                // 1. ส่งไฟล์ไปที่ n8n เพื่อบันทึกลง Google Drive/Sheet
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    status.style.color = "green";
                    status.innerText = "อัปโหลดสำเร็จ! กำลังส่งข้อมูล...";

                    // 2. ใช้ liff.sendMessages เพื่อส่งข้อความแทนตัวผู้ใช้
                    // ข้อความนี้จะไปโผล่ในแชท และทำให้เกิด Webhook Event ไปยัง n8n/Bot
                    if (liff.isInClient()) {
                        await liff.sendMessages([
                            {
                                type: 'text',
                                text: 'ส่งหลักฐานการโอนเงินแล้ว'
                            }
                        ]);
                    }

                    // ปิดหน้าต่าง LIFF หลังจากส่งสำเร็จ
                    setTimeout(() => { liff.closeWindow(); }, 1500);
                } else {
                    throw new Error('Server Error (500)');
                }
            } catch (err) {
                status.style.color = "red";
                status.innerText = "เกิดข้อผิดพลาด: " + err.message;
                submitBtn.disabled = false;
            }
        }

        main();
    </script>
</body>
</html>
