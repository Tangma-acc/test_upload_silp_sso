<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งชำระเงิน - Slip Verification</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #1DB446; --error-color: #dc3545; --text-color: #333; }
        body { font-family: 'Kanit', sans-serif; background-color: #f8f9fa; color: var(--text-color); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 450px; width: 100%; }
        
        .header h2 { margin-top: 0; color: var(--primary-color); }
        .amount-card { background: #f0fdf4; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px dashed var(--primary-color); }
        .amount-label { font-size: 14px; color: #666; margin-bottom: 5px; }
        .amount-value { font-size: 32px; color: var(--primary-color); font-weight: 600; }

        .upload-zone { border: 2px dashed #ccc; padding: 20px; border-radius: 15px; margin-bottom: 20px; cursor: pointer; transition: 0.3s; position: relative; }
        .upload-zone:hover { border-color: var(--primary-color); background: #fafffa; }
        #preview { width: 100%; border-radius: 10px; display: none; margin-bottom: 10px; }
        
        .btn { background: var(--primary-color); color: white; border: none; padding: 16px; border-radius: 12px; cursor: pointer; width: 100%; font-size: 18px; font-weight: 600; transition: 0.3s; box-shadow: 0 4px 12px rgba(29, 180, 70, 0.3); }
        .btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
        
        #status { margin-top: 20px; font-size: 15px; white-space: pre-wrap; transition: 0.5s; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #userProfile { font-size: 13px; color: #888; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>แจ้งโอนเงิน</h2>
        <div id="userProfile">กำลังยืนยันตัวตน...</div>
    </div>

    <div class="amount-card">
        <!-- แก้ไขส่วนแสดงผล เดือน/ปี -->
        <div class="amount-label">รอบการชำระ: <span id="txtPeriod" style="color:var(--text-color); font-weight:bold;">-</span></div>
        <div class="amount-value">฿ <span id="txtAmount">0.00</span></div>
    </div>

    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <img id="preview" src="#" alt="สลิปของคุณ">
        <div id="uploadPlaceholder">
            <span style="font-size: 40px;">📸</span>
            <p>กดเพื่อเลือกรูปภาพสลิป</p>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewImage(this)">
    </div>

    <div id="loader" class="loader"></div>
    <button id="submitBtn" class="btn" onclick="handleProcess()">ตรวจสอบและส่งสลิป</button>
    <p id="status"></p>
</div>

<script>
    const MY_LIFF_ID = '2008841862-yyOOifz4'; 
    const N8N_WEBHOOK_URL = 'https://n8n.chaiwan-acct.com/webhook/payment_slip-sso';

    const urlParams = new URLSearchParams(window.location.search);
    const amountFromUrl = urlParams.get('amount')?.replace(/,/g, '') || "0";
    const monthFromUrl = urlParams.get('month') || "ไม่ระบุ";
    const yearFromUrl = urlParams.get('year') || ""; // รับค่าปีจาก URL
    const gidFromUrl = urlParams.get('groupId');

    async function main() {
        try {
            await liff.init({ liffId: MY_LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }
            const profile = await liff.getProfile();
            document.getElementById('userProfile').innerText = "ผู้ส่ง: " + profile.displayName;
            document.getElementById('txtAmount').innerText = parseFloat(amountFromUrl).toLocaleString(undefined, {minimumFractionDigits: 2});
            
            // แสดงผล เดือน + ปี
            document.getElementById('txtPeriod').innerText = `${monthFromUrl} ${yearFromUrl}`;
        } catch (err) {
            console.error('LIFF Init Error:', err);
        }
    }

    function previewImage(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = "block";
                document.getElementById('uploadPlaceholder').style.display = "none";
            }
            reader.readAsDataURL(file);
        }
    }

    async function handleProcess() {
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');

        if (!fileInput.files[0]) {
            alert('กรุณาเลือกรูปภาพสลิปก่อนครับ');
            return;
        }

        submitBtn.disabled = true;
        loader.style.display = "block";
        status.style.color = "#007bff";
        status.innerText = "กำลังตรวจสอบสลิปด้วยระบบ AI...";

        try {
            const file = fileInput.files[0];
            const profile = await liff.getProfile();
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('userId', profile.userId);
            formData.append('displayName', profile.displayName);
            formData.append('groupId', gidFromUrl || profile.userId);
            formData.append('expectedAmount', amountFromUrl);
            formData.append('month', monthFromUrl);
            formData.append('year', yearFromUrl); // ส่งปีไปที่ n8n ด้วย

            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error("การเชื่อมต่อเซิร์ฟเวอร์ผิดพลาด");

            const result = await response.json();
            loader.style.display = "none";

            if (result.status === "success") {
                status.style.color = "#1DB446";
                status.innerHTML = "<b>✅ ตรวจสอบสำเร็จ</b><br>" + result.message;
                
                if (liff.isInClient()) {
                    await liff.sendMessages([{
                        type: 'text',
                        // ปรับข้อความให้แสดงเดือนและปีตามตัวแปร
                        text: `✅ ${profile.displayName} ชำระค่าประกันสังคม\nประจำเดือน: ${monthFromUrl} ${yearFromUrl}\nยอดเงิน: ${parseFloat(amountFromUrl).toLocaleString()} บาท`
                    }]);
                }
                setTimeout(() => { liff.closeWindow(); }, 3000);
            } else {
                status.style.color = "#dc3545";
                status.innerHTML = "<b>❌ ข้อมูลไม่ถูกต้อง</b><br>" + result.message;
                submitBtn.disabled = false;
            }

        } catch (err) {
            loader.style.display = "none";
            status.style.color = "#dc3545";
            status.innerText = "❌ เกิดข้อผิดพลาด: " + err.message;
            submitBtn.disabled = false;
        }
    }

    main();
</script>
</body>
</html>
